<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Outer Web Ring -->
    <path d="M50 5 L90 27 L90 73 L50 95 L10 73 L10 27 Z" fill="none" stroke="url(#brand-grad)" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)" />

    <!-- Scrapling Claw / Data Web Nodes -->
    <path d="M50 22 L75 37 L75 63 L50 78 L25 63 L25 37 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
    <circle cx="50" cy="50" r="14" fill="url(#brand-grad)" />

    <!-- Data Extract Spark / Code Brackets -->
    <path d="M43 44 L37 50 L43 56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M57 44 L63 50 L57 56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(115, 68)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      SCRAP<tspan fill="url(#brand-grad)">FLOW</tspan>
    </text>
    <text x="2" y="22" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="2">
      POWERED BY SCRAPLING
    </text>
  </g>
</svg>
