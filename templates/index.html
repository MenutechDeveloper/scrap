<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MENUTECH - Extractor Web</title>
  <link rel="icon" type="image/png" href="/static/images/logomt.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="container">
      <div class="brand-logo">
        <img src="/static/images/logomt.png" alt="MENUTECH Logo">
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Scraper Form Card -->
    <div class="scraper-card">
      <form id="scraperForm">
        <div class="input-group-grid">
          <div class="input-wrapper">
            <input type="url" id="urlInput" class="form-control" placeholder="" required>
          </div>

          <button type="submit" id="btnScrape" class="btn-primary">
            Scrapear Sitio
          </button>
        </div>
      </form>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <p style="color: var(--accent-primary); font-weight: 600;">Extrayendo información...</p>
      <p style="color: var(--text-muted); font-size: 13px;">Procesando sitio web y parseando datos</p>
    </div>

    <!-- Results Section -->
    <section id="resultsSection" class="results-section">
      <div class="results-header">
        <div class="results-info">
          <h2 id="resTitle">Resultados de Extracción</h2>
          <p id="resSub">URL: <span id="resUrl" style="color: var(--accent-primary);"></span> | Total: <strong id="resCount">0</strong> bloques</p>
        </div>

        <!-- Export Buttons (Plain text only) -->
        <div class="export-bar">
          <button id="btnCopyAll" class="btn-export">
            Copiar Todo
          </button>

          <a href="/export/sheets" target="_blank" class="btn-export btn-export-sheets">
            Google Sheets (.csv)
          </a>
          <a href="/export/txt" target="_blank" class="btn-export">TXT</a>
          <a href="/export/pdf" target="_blank" class="btn-export">PDF</a>
          <a href="/export/svg" target="_blank" class="btn-export">SVG Card</a>
          <a href="/export/json" target="_blank" class="btn-export">JSON</a>
        </div>
      </div>

      <!-- Blocks Grid -->
      <div id="blocksGrid" class="blocks-grid"></div>
    </section>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast">
    <span id="toastMsg">Contenido copiado al portapapeles</span>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
